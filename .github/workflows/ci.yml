name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        shell: bash
        run: |
          if [ -d src ] && find src -type f -name "*.ts" | grep -q .; then
            npm run typecheck
          else
            echo "Skipping typecheck: no TS files in src"
          fi

      - name: Lint
        shell: bash
        run: |
          if [ -d src ] && find src -type f -name "*.ts" | grep -q .; then
            npm run lint
          else
            echo "Skipping lint: no TS files in src"
          fi

      - name: Tests
        shell: bash
        env:
          CI: true
        run: |
          if [ -d src ] && find src -type f -name "*.ts" | grep -q .; then
            npm test -- --ci
          else
            echo "Skipping tests: no TS files in src"
          fi