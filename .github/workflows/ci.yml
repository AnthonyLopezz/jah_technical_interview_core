name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: ${{ hashFiles('tsconfig.json') != '' && hashFiles('src/**/*.ts') != '' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ hashFiles('src/**/*.ts') != '' }}
        run: npm run lint

      - name: Tests
        if: ${{ hashFiles('src/**/*.ts') != '' }}
        env:
          CI: true
        run: npm test -- --ci