version: '3.9'
services:
  db:
    image: mysql:8.0
    container_name: backend_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pruebatecnica
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -proot || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: backend_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_ENABLED: 'true'
      DB_HOST: db
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: pruebatecnica
      CORS_ORIGIN: 'http://localhost:4200'
      JWT_SECRET: 'change_me'
    ports:
      - '3000:3000'
    restart: unless-stopped

volumes:
  db_data: